version: 3
workdir: .
allow:
  deepScan: false
  depOnAnyVendor: false
  ignoreNotFoundComponents: true
excludeFiles:
  - "^.*_test\\.go$"
vendors:
  unicode-text: {in: [golang.org/x/text/cases, golang.org/x/text/unicode/norm]}
  pgx: {in: ["github.com/jackc/pgx/v5", "github.com/jackc/pgx/v5/**"]}
  amqp: {in: ["github.com/rabbitmq/amqp091-go"]}
  redis: {in: ["github.com/redis/go-redis/v9", "github.com/redis/go-redis/v9/**"]}
components:
  domain: {in: "internal/domain/**"}
  contract: {in: "contract/**"}
  application: {in: "internal/application/**"}
  adapters: {in: "internal/adapters/**"}
  bootstrap: {in: "bootstrap/**"}
  process: {in: "cmd/**"}
  testsupport: {in: "tests/testsupport/**"}
  tests: {in: "tests/**"}
  contracttests: {in: "tests/contracts/**"}
  integration: {in: "tests/integration/**"}
  acceptance: {in: "tests/acceptance/**"}
deps:
  domain:
    mayDependOn: [domain]
  contract:
    mayDependOn: [contract]
  application:
    canUse: [unicode-text]
    mayDependOn: [application, domain, contract]
  adapters:
    mayDependOn: [adapters, application, domain, contract]
    canUse: [pgx, amqp, redis]
  bootstrap:
    mayDependOn: [bootstrap, application, adapters, contract]
  process:
    mayDependOn: [process, bootstrap]
  testsupport:
    mayDependOn: [testsupport, application, domain, contract]
  tests:
    mayDependOn: [tests, testsupport, application, adapters, domain, contract, bootstrap]
    canUse: [pgx, amqp, redis]
  contracttests:
    mayDependOn: [contracttests, application, adapters, domain, contract, testsupport]
  integration:
    mayDependOn: [integration, bootstrap, contract, testsupport]
  acceptance:
    mayDependOn: [acceptance, bootstrap, contract, testsupport]
